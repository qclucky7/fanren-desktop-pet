name: 发布 Windows 安装包

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 验证测试
        run: npm test

      - name: 校验 tag 与应用版本
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${APP_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与应用版本 v${APP_VERSION} 不一致" >&2
            exit 1
          fi

      - name: 读取发布说明
        id: release_notes
        shell: bash
        run: |
          NOTES_FILE="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "缺少发布说明：$NOTES_FILE" >&2
            exit 1
          fi
          echo "body<<RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"
          cat "$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"

      - name: 构建并创建 GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 凡人修仙传桌宠 v__VERSION__
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseAssetNamePattern: 凡人修仙传桌宠_[version]_[arch]-setup[ext]
