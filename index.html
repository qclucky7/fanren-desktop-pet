<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#292929" media="(prefers-color-scheme: dark)" />
    <title>凡人修仙传桌宠</title>
    <script>
      document.documentElement.dataset.view = new URLSearchParams(location.search).get("view") === "pet"
        ? "pet"
        : "settings";
    </script>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      html[data-view="settings"], html[data-view="settings"] body { background: #f5f5f5; }
      html[data-view="pet"], html[data-view="pet"] body { background: transparent; }
      html[data-view="pet"] .startup-screen { display: none; }
      .startup-screen {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        color: #616161;
        font: 13px/1.5 "Microsoft YaHei UI", "PingFang SC", sans-serif;
      }
      .startup-screen__content { display: flex; align-items: center; gap: 10px; }
      .startup-screen__indicator {
        width: 14px;
        height: 14px;
        border: 2px solid #d1d1d1;
        border-top-color: #616161;
        border-radius: 50%;
        animation: startup-spin .8s linear infinite;
      }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html[data-view="settings"], html[data-view="settings"] body { background: #292929; }
        .startup-screen { color: #d6d6d6; }
        .startup-screen__indicator { border-color: #525252; border-top-color: #d6d6d6; }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-screen__indicator { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-screen" role="status">
        <div class="startup-screen__content">
          <span class="startup-screen__indicator" aria-hidden="true"></span>
          <span>正在打开宠物管理…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
